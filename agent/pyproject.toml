[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "algopaper-agent"
version = "0.1.0"
description = "AlgoPaper live paper trading agent"
requires-python = ">=3.12"

dependencies = [
    # Data feeds
    "alpaca-py>=0.20.0",
    "yfinance>=0.2.40",
    "pandas-datareader>=0.10.0",      # FRED data
    "requests>=2.31.0",`n    "websocket-client>=1.8.0",

    # Data processing
    "pandas>=2.1.0",
    "numpy>=1.26.0",
    "pandas-ta",                       # technical indicators (no TA-Lib C dependency)

    # ML
    "xgboost>=2.0.0",
    "lightgbm>=4.1.0",
    "scikit-learn>=1.3.0",
    "joblib>=1.3.0",

    # Database
    "supabase>=2.3.0",

    # Utilities
    "python-dotenv>=1.0.0",
    "pytz>=2024.1",
    "schedule>=1.2.0",
    "loguru>=0.7.2",
    "httpx>=0.26.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
]

[project.scripts]
algopaper-train   = "agent.model.train:main"
algopaper-backtest = "agent.backtest.engine:main"
algopaper-live    = "agent.main:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

