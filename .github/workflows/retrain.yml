name: Weekly Model Retrain

on:
  schedule:
    # Every Sunday at 2:00 AM ET (7:00 AM UTC)
    - cron: "0 7 * * 0"
  workflow_dispatch:   # Allow manual trigger from GitHub Actions UI

jobs:
  retrain:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install agent dependencies
        run: |
          pip install --upgrade pip
          pip install \
            "alpaca-py>=0.20.0" \
            "yfinance>=0.2.40" \
            "pandas-datareader>=0.10.0" \
            "requests>=2.31.0" \
            "pandas>=2.1.0" \
            "numpy>=1.26.0" \
            "pandas-ta>=0.3.14b" \
            "xgboost>=2.0.0" \
            "scikit-learn>=1.3.0" \
            "joblib>=1.3.0" \
            "supabase>=2.3.0" \
            "python-dotenv>=1.0.0" \
            "pytz>=2024.1" \
            "loguru>=0.7.2" \
            "httpx>=0.26.0"

      - name: Run retrain
        env:
          ALPACA_API_KEY:    ${{ secrets.ALPACA_API_KEY }}
          ALPACA_API_SECRET: ${{ secrets.ALPACA_API_SECRET }}
          SUPABASE_URL:      ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY:      ${{ secrets.SUPABASE_KEY }}
        run: |
          cd agent
          python -m model.retrain

      - name: Commit new model to repo
        run: |
          git config user.name  "AlgoPaper Bot"
          git config user.email "bot@algopaper.local"
          git add agent/models/
          git diff --cached --quiet || git commit -m "chore: weekly model retrain $(date -u +%Y%m%d_%H%M)"
          git push

      - name: Log model version to Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          python -c "
          import sys, os, pickle, glob
          sys.path.insert(0, 'agent')
          from db.supabase_client import log_model_version
          models = sorted(glob.glob('agent/models/regime_model_2*.pkl'))
          if models:
              with open(models[-1], 'rb') as f:
                  p = pickle.load(f)
              log_model_version(p['version'], p['val_sharpe'], notes='Weekly retrain via GitHub Actions')
              print(f'Logged version {p[\"version\"]} sharpe={p[\"val_sharpe\"]:.3f}')
          "

      - name: Restart Fly.io agent with new model
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          curl -s -X POST "https://api.fly.io/v1/apps/algopaper-agent/machines/restart" \
            -H "Authorization: Bearer $FLY_API_TOKEN" \
            -H "Content-Type: application/json" || \
          echo "Fly.io restart skipped (FLY_API_TOKEN not set or app not deployed yet)"
